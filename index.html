<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A medida · Entrenamiento integral</title>
<meta name="description" content="A medida · Entrenamiento integral. Tu entrenamiento, macros y medidas con Ricky.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1524" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A medida">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script>(function(){var m=null;try{m=localStorage.getItem('am.modo');}catch(e){}if(!m)m=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'oscuro';document.documentElement.classList.toggle('claro',m==='claro');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Rediseño A medida: misma paleta Monitor, una sola gramática visual.
   Título grande por pantalla · tarjetas de 22 px · números tabulares · un solo color de acción · estados con color semántico. */
:root{color-scheme:dark;
  --bg:#0b1524;--surf:#101d30;--surf2:#15243a;--surf3:#1b2c45;--line:#1f3049;--line2:#2a3f5f;
  --tx:#e8eef7;--tx2:#a9b7cc;--tx3:#8e9db5;--tx4:#5d6c85;
  --a1:#6e9bff;--a2:#9cbbff;--grad:linear-gradient(90deg,#6e9bff,#9cbbff);--ink:#081223;
  --grn:#5cc98c;--red:#e5604a;--yel:#ef8d45;--vio:#a99ad6;--cya:#4fd1e6;
  --a1rgb:110,155,255;--grnrgb:92,201,140;--yelrgb:239,141,69;--fg:255,255,255;
  --glass:rgba(16,29,48,.86);--glass2:rgba(11,21,36,.84);--cream:#f4f2ee;--sh:0 18px 40px -22px rgba(0,0,0,.7);
  --f:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --navh:64px}
html.claro{color-scheme:light;
  --bg:#f3f5f9;--surf:#ffffff;--surf2:#f7f9fc;--surf3:#eef2f7;--line:#e3e8ef;--line2:#d5dce6;
  --tx:#0e1a2b;--tx2:#46536a;--tx3:#5f6b82;--tx4:#8a96aa;
  --a1:#1d4ed8;--a2:#3b6cf0;--grad:linear-gradient(90deg,#1d4ed8,#3b6cf0);--ink:#ffffff;
  --grn:#2f8a57;--red:#af321d;--yel:#b85a14;--vio:#523d8f;--cya:#1d8fa3;
  --a1rgb:29,78,216;--grnrgb:47,138,87;--yelrgb:184,90,20;--fg:14,26,43;
  --glass:rgba(255,255,255,.92);--glass2:rgba(243,245,249,.92);--sh:0 16px 34px -22px rgba(14,26,43,.35);
  --f:'Manrope',system-ui,-apple-system,sans-serif}
html.enmarco{--navh:88px}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
svg{flex-shrink:0}

/* ---------- marco ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 16px;background:var(--glass2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.borde{border-bottom-color:var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo i{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--surf3),var(--surf));border:1px solid var(--line2)}
.logo i svg{width:19px;height:19px}
.atras{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px 0 2px;margin-left:-6px;border:0;border-radius:12px;background:transparent;font-weight:600;font-size:15px;color:var(--a1)}
.atras svg{width:22px;height:22px}
.top .tt{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ib svg{width:18px;height:18px}
.yo{width:38px;height:38px;border-radius:50%;border:0;background:var(--grad);color:var(--ink);font-weight:700;font-size:15px}
.sync{position:relative}
.sync::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--yel);box-shadow:0 0 0 2px var(--surf)}
.main{padding:6px 16px calc(var(--navh) + 40px)}
.main.sinnav{padding-bottom:140px}
.main.conmini{padding-bottom:calc(var(--navh) + 110px)}
html.enmarco .main.conmini{padding-bottom:210px!important}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.bnav[hidden]{display:none}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:0;border-radius:14px;background:transparent;color:var(--tx3);font-size:11px;font-weight:600}
.nv svg{width:23px;height:23px}
.nv.on{color:var(--tx)}
.nv.on svg{color:var(--a1)}
.nv.on::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--a1)}
.nv .pt{position:absolute;top:8px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 2px var(--bg)}

/* ---------- tipografía y piezas comunes ---------- */
.hd{margin:8px 0 16px}
.ey{display:block;font-size:13px;font-weight:600;color:var(--a1)}
.hd h1{margin:2px 0 0;font-size:32px;line-height:1.05;letter-spacing:-.035em;font-weight:700}
.hd p{margin:6px 0 0;font-size:14px;color:var(--tx3)}
.hd .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sh h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3)}
.sh button{border:0;background:transparent;padding:0;font-size:13.5px;font-weight:600;color:var(--a1)}
.card{border-radius:22px;background:var(--surf);border:1px solid var(--line);padding:16px}
.card+.card{margin-top:12px}
.card h3{margin:0;font-size:17px;letter-spacing:-.015em}
.card .sub{margin:3px 0 0;font-size:13px;color:var(--tx3)}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.big small{font-size:13px;font-weight:500;color:var(--tx3);letter-spacing:0;margin-left:3px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--tx3)}
.mu{color:var(--tx3)}
.up{color:var(--grn)} .wa{color:var(--yel)}
.pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:15px;background:var(--grad);color:var(--ink);font-weight:700;font-size:15.5px;box-shadow:0 12px 26px -14px rgba(var(--a1rgb),.95)}
.pri.full{width:100%}
.pri svg{width:19px;height:19px}
.sec{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);font-weight:600;font-size:14.5px}
.sec svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(var(--fg),.07);color:var(--tx2);white-space:nowrap}
.chip.ok{background:rgba(var(--grnrgb),.15);color:var(--grn)}
.chip.ac{background:rgba(var(--a1rgb),.15);color:var(--a1)}
.chip.wa{background:rgba(var(--yelrgb),.16);color:var(--yel)}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.seg button{flex:1;min-height:36px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:13.5px;color:var(--tx3);padding:0 6px}
.seg button[aria-pressed="true"]{background:rgba(var(--a1rgb),.15);color:var(--tx)}
.seg.sm button{min-height:30px;font-size:12.5px}
.per{display:flex;gap:6px;margin:10px 0 0}
.per button{flex:1;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:600;color:var(--tx3)}
.per button[aria-pressed="true"]{border-color:var(--a1);color:var(--a1);background:rgba(var(--a1rgb),.1)}
.lam{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--cream)}
.lam img{display:block;width:100%;height:100%;object-fit:cover}
.qi{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:12px;font-weight:600;color:var(--tx3);flex:0 0 auto}
.qi svg{width:14px;height:14px}
.qi[aria-expanded="true"]{color:var(--a1);border-color:var(--a1)}
.exp{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surf2);font-size:13px;color:var(--tx2)}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(var(--a1rgb),.14);color:var(--a1);flex:0 0 40px}
.ico svg{width:20px;height:20px}
.ico.ok{background:rgba(var(--grnrgb),.15);color:var(--grn)}
.ico.wa{background:rgba(var(--yelrgb),.16);color:var(--yel)}
.ico.cy{background:rgba(79,209,230,.14);color:var(--cya)}
.lista>*{border-top:1px solid var(--line)}
.lista>*:first-child{border-top:0}
.fila{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;background:transparent;text-align:left}
.fila b{display:block;font-size:14.5px;line-height:1.3}
.fila span.s{display:block;font-size:12.5px;color:var(--tx3);margin-top:1px}
.fila>svg{width:18px;height:18px;color:var(--tx4)}

/* ---------- Hoy ---------- */
.ent{padding:0;overflow:hidden}
.ent .img{position:relative;aspect-ratio:3/2;background:var(--cream)}
.ent .img img{display:block;width:100%;height:100%;object-fit:cover}
.ent .img .chip{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:#0e1a2b}
.ent .in{padding:14px 16px 16px}
.ent h2{margin:0;font-size:24px;letter-spacing:-.03em}
.ent .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.tile{border-radius:20px;background:var(--surf);border:1px solid var(--line);padding:14px;min-width:0;text-align:left;width:100%}
.tile .lbl{margin-bottom:6px}
.tile .s{font-size:12px;color:var(--tx3);margin-top:3px}
.ringw{display:flex;align-items:center;gap:10px}
.ringw svg{width:56px;height:56px}
.dots{display:flex;justify-content:space-between;margin-top:10px}
.dots span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--tx4);font-weight:600}
.dots i{width:18px;height:18px;border-radius:6px;background:var(--surf3)}
.dots .ok i{background:var(--grn)}
.dots .hoy i{background:transparent;box-shadow:inset 0 0 0 2px var(--a1)}
.dots .pl i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}

/* ---------- Sesión ---------- */
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.prog b{font-size:13px}
.ruta{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none}
.ruta::-webkit-scrollbar{display:none}
.ruta button{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-size:12.5px;font-weight:600;color:var(--tx3)}
.ruta button i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.ruta button.ok i{background:var(--grn)}
.ruta button[aria-pressed="true"]{border-color:rgba(var(--a1rgb),.6);color:var(--tx);background:rgba(var(--a1rgb),.12)}
.ruta button[aria-pressed="true"] i{background:var(--a1)}
.bk{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;margin:0 2px 8px}
.bk b{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--a1);white-space:nowrap}
.bk span{font-size:12.5px;color:var(--tx3)}
.ej{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.ej+.ej{margin-top:8px}
.ej h4{margin:0;font-size:15px;line-height:1.25;letter-spacing:-.01em}
.ej .vl{display:inline-flex;align-items:center;gap:5px;margin-top:4px;border:0;background:transparent;padding:0;font-size:12.5px;font-weight:600;color:var(--a1);text-align:left}
.ej .vl svg{width:13px;height:13px}
.ej .ob{display:block;font-size:12px;color:var(--tx3);margin-top:3px}
.tg{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 5px;border-radius:7px;background:rgba(var(--a1rgb),.14);color:var(--a1);font-size:11.5px;font-weight:700;margin-right:6px;vertical-align:1px}
.vt{margin-top:14px}
.vt .vh{display:flex;justify-content:space-between;margin:0 2px 6px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3)}
.vt .vh span{text-transform:none;letter-spacing:0;font-weight:600}
.vt.hecha{opacity:.55}
.sr{display:grid;grid-template-columns:36px 1fr 1fr 1fr 52px;gap:6px;align-items:center;margin-bottom:6px}
.sr .n{font-size:12px;font-weight:700;color:var(--tx3);text-align:center}
.sr input{width:100%;min-width:0;height:50px;border-radius:13px;border:1px solid var(--line2);background:var(--surf);text-align:center;font-size:17px;font-weight:700}
.sr input::placeholder{color:var(--tx4);font-weight:600}
.sr .ok{height:50px;border-radius:13px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx4);display:flex;align-items:center;justify-content:center}
.sr .ok svg{width:22px;height:22px}
.sr.h input{background:rgba(var(--grnrgb),.08);border-color:rgba(var(--grnrgb),.35)}
.sr.h .ok{background:var(--grn);border-color:var(--grn);color:#fff}
.sr.sig input{border-color:rgba(var(--a1rgb),.6)}
.cab{display:grid;grid-template-columns:36px 1fr 1fr 1fr 52px;gap:6px;font-size:11px;color:var(--tx4);font-weight:600;text-align:center;margin:0 0 4px}
.drop{display:grid;grid-template-columns:36px 1fr;gap:6px;margin:-2px 0 8px}
.drop span{grid-column:2;font-size:12px;color:var(--tx3);padding:6px 10px;border-radius:10px;border:1px dashed var(--line2)}
.bajo{display:flex;gap:8px;margin-top:16px}
.bajo .pri{flex:1}
.vsheet .op{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.vsheet .op button{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surf2);font-weight:600;font-size:13.5px;text-transform:capitalize}
.vsheet .op button[aria-pressed="true"]{background:var(--a1);border-color:var(--a1);color:var(--ink)}
.vsheet .op button.mas{width:38px;padding:0;color:var(--tx3);display:flex;align-items:center;justify-content:center}

/* barras flotantes */
.flot{position:fixed;left:12px;right:12px;z-index:24;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 10px 9px 12px;border-radius:18px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:var(--sh)}
.flot b{display:block;font-size:14px}
.flot span.s{display:block;font-size:12px;color:var(--tx3)}
.flot .bt{height:38px;padding:0 11px;border-radius:11px;border:1px solid var(--line2);background:var(--surf);font-weight:700;font-size:13px}
.flot[hidden]{display:none}
#timer{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
html.enmarco #timer{bottom:36px}
#mini{bottom:calc(var(--navh) + 10px);grid-template-columns:auto 1fr auto;cursor:pointer;text-align:left;width:auto;font:inherit;color:inherit}
#mini .pul{width:10px;height:10px;border-radius:50%;background:var(--grn);animation:pul 1.8s ease-out infinite}
@keyframes pul{0%{box-shadow:0 0 0 0 rgba(var(--grnrgb),.6)}100%{box-shadow:0 0 0 10px rgba(var(--grnrgb),0)}}
#mini svg{width:18px;height:18px;color:var(--tx3)}

/* ---------- Resumen ---------- */
.hero{padding:0;overflow:hidden}
.hero .img{aspect-ratio:3/2;background:var(--cream)}
.hero .img img{display:block;width:100%;height:100%;object-fit:cover}
.hero .in{padding:14px 16px 16px}
.hero h2{margin:0;font-size:24px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.hero h2 i{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--grn);color:#fff;align-items:center;justify-content:center}
.hero h2 i svg{width:17px;height:17px}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.k4 div{padding:9px 4px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);text-align:center}
.k4 b{display:block;font-size:17px;letter-spacing:-.02em}
.k4 span{display:block;font-size:10.5px;color:var(--tx3);font-weight:600}
.cmp{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cmp .r{display:grid;grid-template-columns:96px 1fr 66px;gap:10px;align-items:center;font-size:12.5px}
.cmp .r>span:first-child{color:var(--tx3);font-weight:600}
.cmp .br{position:relative;height:22px}
.cmp .br i{position:absolute;left:0;height:9px;border-radius:5px}
.cmp .br i.a{top:0;background:var(--line2)}
.cmp .br i.b{top:12px;background:var(--grad)}
.cmp .r b{text-align:right;font-size:13px}
.esf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.esf button{height:56px;border-radius:13px;border:1px solid var(--line2);background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:17px}
.esf button span{font-size:10px;font-weight:600;color:var(--tx3)}
.esf button[aria-pressed="true"]{background:rgba(var(--a1rgb),.16);border-color:var(--a1);color:var(--a1)}
.esf button[aria-pressed="true"] span{color:var(--a1)}
textarea{width:100%;margin-top:12px;min-height:66px;border-radius:13px;border:1px solid var(--line2);background:var(--surf2);font-size:14px;padding:10px 12px;resize:vertical}

/* ---------- Calendario ---------- */
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.mes .dw{font-size:11px;font-weight:700;color:var(--tx4);text-align:center;padding-bottom:2px}
.mes button{aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-size:15px;font-weight:700;padding:0;min-width:0}
.mes button span{font-size:9px;font-weight:700;letter-spacing:.1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mes .ok{background:rgba(var(--grnrgb),.13);border-color:rgba(var(--grnrgb),.32)}
.mes .ok span{color:var(--grn)}
.mes .fa{background:rgba(229,96,74,.12);border-color:rgba(229,96,74,.35)}
.mes .fa span{color:var(--red)}
.mes .pl{background:transparent;border-style:dashed;border-color:rgba(var(--a1rgb),.55)}
.mes .pl span{color:var(--a1)}
.mes .hoy{box-shadow:0 0 0 2px var(--a1)}
.mes .sel{background:rgba(var(--a1rgb),.18)}
.mes .vac{visibility:hidden}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp3 div{padding:10px 12px;border-radius:14px;background:var(--surf2);border:1px solid var(--line)}
.kp3 b{font-size:20px;letter-spacing:-.02em}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhd b{font-size:17px}
.mhd .ib{width:36px;height:36px}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--tx3)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.op2{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;padding:11px 12px;margin-top:8px;border-radius:16px;border:1px solid var(--line);background:var(--surf2);text-align:left}
.op2 .d{display:flex;flex-direction:column;align-items:center;padding:5px 0;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-size:11px;color:var(--tx3)}
.op2 .d b{font-size:17px;color:var(--tx)}
.op2 b.t{display:block;font-size:14px}
.op2 span.s{font-size:12px;color:var(--tx3)}
.op2[aria-pressed="true"]{border:2px solid var(--a1);background:rgba(var(--a1rgb),.08)}

/* ---------- Progreso ---------- */
.kp{display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surf)}
.kp div{padding:13px 14px;border-top:1px solid var(--line)}
.kp div:nth-child(-n+2){border-top:0}
.kp div:nth-child(odd){border-right:1px solid var(--line)}
.kp b{display:block;font-size:23px;letter-spacing:-.03em;margin-top:2px}
.kp em{font-style:normal;font-size:12px;font-weight:600}
.recs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.recs::-webkit-scrollbar{display:none}
.rc{flex:0 0 150px;padding:12px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.rc b{display:block;font-size:13.5px;margin-top:8px;line-height:1.25}
.rc span{display:block;font-size:12px;color:var(--tx3);margin-top:2px}
.rc .ico{width:30px;height:30px;flex-basis:30px;border-radius:10px}
.rc .ico svg{width:16px;height:16px}
.gp{display:grid;grid-template-columns:92px 32px 1fr;gap:8px;align-items:center;padding:7px 0;font-size:13.5px}
.gp b{text-align:right}
.gp i{display:block;height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.gp i u{display:block;height:100%}
.wks{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 4px;padding:0 16px;scrollbar-width:none}
.wks button{flex:0 0 auto;height:32px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:600;color:var(--tx3)}
.wks button[aria-pressed="true"]{background:var(--a1);border-color:var(--a1);color:var(--ink)}
.av{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(var(--yelrgb),.12);font-size:13px;color:var(--tx2)}
.av b{color:var(--yel)}
.exr{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;background:transparent;text-align:left}
.exr .lam{border-radius:10px}
.exr b{display:block;font-size:14.5px;line-height:1.25}
.exr span.s{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px}
.exd{padding:4px 0 14px}

/* ---------- Macros ---------- */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:13px;border:1px solid var(--line);background:var(--surf);font-size:11px;color:var(--tx3);font-weight:600}
.wstrip button b{font-size:16px;color:var(--tx)}
.wstrip button[aria-pressed="true"]{border:2px solid var(--a1)}
.wstrip button.fut{opacity:.45}
.mac{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.mac svg{width:118px;height:118px}
.mb{display:flex;flex-direction:column;gap:10px}
.mb div{font-size:12.5px}
.mb .t{display:flex;justify-content:space-between;color:var(--tx3);font-weight:600}
.mb .t b{color:var(--tx)}
.mb i{display:block;height:7px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:4px}
.mb i u{display:block;height:100%}
.ml{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0}
.ml b{font-size:15px}
.ml .s{display:block;font-size:12.5px;color:var(--tx3);margin-top:1px}
.add{height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--line2);background:var(--surf2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;color:var(--a1)}
.add svg{width:15px;height:15px}
.srch{display:flex;align-items:center;gap:8px;height:46px;margin-top:12px;padding:0 12px;border-radius:13px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx3);font-size:14px}
.srch svg{width:18px;height:18px}
.fast{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fast button{display:flex;align-items:center;gap:8px;min-height:50px;padding:8px 10px;border-radius:14px;border:1px dashed var(--line2);background:transparent;text-align:left;font-size:12.5px;font-weight:600;color:var(--tx2)}
.fast svg{width:18px;height:18px;color:var(--a1)}
.it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0}
.it b{display:block;font-size:14px;line-height:1.3}
.it .s{font-size:12px;color:var(--tx3)}
.it .s u{text-decoration:none;font-weight:700;color:var(--cya)}
.it button{width:42px;height:42px;border-radius:13px;border:0;background:rgba(var(--a1rgb),.14);color:var(--a1);display:flex;align-items:center;justify-content:center}
.it button svg{width:20px;height:20px}
.it button.hecho{background:var(--grn);color:#fff}
.hint{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(79,209,230,.1);font-size:13px;color:var(--tx2)}
.hint b{color:var(--cya)}

/* ---------- Medidas ---------- */
.tk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tk .tile b{font-size:24px;letter-spacing:-.03em}
.tk .tile b small{font-size:12.5px;font-weight:500;color:var(--tx3);margin-left:2px}
.tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tabla th,.tabla td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla th{font-size:11.5px;color:var(--tx3);font-weight:600}
.tabla tr.g td{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--a1);padding-top:14px}
.tabla tr.t td{font-weight:700}
.pr{display:flex;gap:3px;margin-bottom:12px}
.pr i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.pr i.ok{background:var(--grn)}
.pr i.on{background:var(--a1)}
.mapa{position:relative;border-radius:20px;overflow:hidden;background:var(--cream);aspect-ratio:3/2;border:1px solid var(--line)}
.mapa img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(.92) brightness(1.06)}
.mapa .pt{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;border:2px solid #fff;background:#9aa6b8;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mapa .pt.ok{background:#2f8a57}
.mapa .pt.on{width:20px;height:20px;margin:-10px 0 0 -10px;background:#1d4ed8;animation:lat 1.6s ease-out infinite}
@keyframes lat{0%{box-shadow:0 0 0 0 rgba(29,78,216,.55)}100%{box-shadow:0 0 0 16px rgba(29,78,216,0)}}
.mapa .lb{position:absolute;left:10px;bottom:10px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.92);color:#0e1a2b;font-size:12px;font-weight:700}
.sit h2{margin:14px 0 0;font-size:28px;letter-spacing:-.03em}
.sit p{margin:4px 0 0;font-size:13.5px;color:var(--tx3)}
.tm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.tm.uno{grid-template-columns:1fr}
.tm label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--tx3)}
.tm input{height:60px;border-radius:15px;border:1px solid var(--line2);background:var(--surf);text-align:center;font-size:23px;font-weight:700;width:100%;min-width:0}
.tm label.pide input{border-color:var(--yel);box-shadow:0 0 0 3px rgba(var(--yelrgb),.22)}
.tm label.off{opacity:.4}
.al{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;color:var(--tx2);background:rgba(var(--yelrgb),.12)}
.al b{color:var(--yel)}
.al.ok{background:rgba(var(--grnrgb),.12)}
.al.ok b{color:var(--grn)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.res div{padding:10px 12px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.res b{font-size:20px;letter-spacing:-.02em}
.nav2{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:16px}

/* ---------- hojas ---------- */
.velo{position:fixed;inset:0;z-index:30;background:rgba(3,8,16,.45);animation:fi .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:80%;overflow:auto;border-radius:26px 26px 0 0;background:var(--surf);border-top:1px solid var(--line2);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 40px -20px rgba(0,0,0,.5);animation:su .25s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.02em}
.sheet .sub{margin:3px 0 0;font-size:13px;color:var(--tx3)}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(40%);opacity:.4}}
.toast{position:fixed;left:50%;top:70px;z-index:50;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:var(--tx);color:var(--bg);font-size:13.5px;font-weight:600;box-shadow:var(--sh);animation:fi .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Calendario (rediseño) ---------- */
/* calendario como la app actual */
.calhd{display:flex;align-items:center;gap:8px}
.calhd h2{flex:1;margin:0;font-size:18px;text-transform:capitalize;text-align:center}
.calhd .xb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.calhd .xb svg{width:18px;height:18px}
.calhd .xb:disabled{opacity:.3}
.kgr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpa{padding:10px 12px;border-radius:14px;background:var(--surf2);border:1px solid var(--line)}
.kpa small{display:block;font-size:12px;color:var(--tx3);font-weight:600}
.kpa b{font-size:22px;letter-spacing:-.03em}
.kpa em{font-style:normal;font-size:13px;color:var(--tx3);font-weight:500;margin-left:3px}
.calx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.calx .dow{font-size:12px;color:var(--tx3);text-align:center;font-weight:600;padding-bottom:2px}
.cd{position:relative;min-height:58px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--fg),.02);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 4px;gap:1px;min-width:0;color:var(--tx2)}
.entra .cd{animation:pop .3s cubic-bezier(.3,1.4,.5,1) both}
.cd b{font-size:14px;font-weight:700;color:var(--tx)}
.cd small{font-size:9.5px;letter-spacing:-.2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--tx3)}
.cd.ok{background:rgba(var(--grnrgb),.11);border-color:rgba(var(--grnrgb),.32)}
.cd.ok small{color:var(--grn)}
.cd.no{background:rgba(229,96,74,.09);border-color:rgba(229,96,74,.32)}
.cd.no small{color:var(--red)}
.cd.vac small{color:var(--cya)}
.cd.plan{border-style:dashed;border-color:var(--line2)}
.cd.plan small{color:var(--a1)}
.cd.fut b{color:var(--tx3)}
.cd.hoy{box-shadow:inset 0 0 0 1.5px var(--a1)}
.cd.sel{box-shadow:0 0 0 2px var(--a1),0 10px 22px -12px rgba(var(--a1rgb),.9);z-index:1}
.cd.pad{visibility:hidden}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--tx3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
#calDet h3{margin:0;font-size:17px}
.ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dex{display:flex;flex-direction:column;margin-top:10px}
.dex>div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.dex b{font-size:14px}
.dex span{font-size:13.5px;font-weight:700;text-align:right}
.dex small{grid-column:1/-1;font-size:12px;color:var(--tx3)}

/* bocetos inspirados en apps de deporte */
.hvk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hvk>div{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.hvi{grid-row:1/3;font-size:22px}
.hvk b{font-size:24px;letter-spacing:-.03em;line-height:1}
.hvk span:last-child{font-size:11.5px;color:var(--tx3);line-height:1.3}
.hvm{margin-bottom:12px}
.hvg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;margin-top:10px}
.hvg .dw{font-size:11px;font-weight:700;color:var(--tx4);text-align:center}
.hvd{justify-self:center;width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--tx3);animation:pop .3s cubic-bezier(.3,1.4,.5,1) both}
.hvd.ok{background:var(--a1);color:var(--ink);font-weight:700;box-shadow:0 6px 14px -8px rgba(var(--a1rgb),.9)}
.hvd.cur{background:rgba(var(--a1rgb),.55)}
.hvd.pl{box-shadow:inset 0 0 0 1.5px rgba(var(--a1rgb),.55);color:var(--tx)}
.hvd.hoyc{outline:2px solid var(--tx);outline-offset:2px}
.tl{padding:12px 10px}
.tlh,.tlr{display:grid;grid-template-columns:40px repeat(7,1fr) 50px;align-items:center}
.tlh span{font-size:10.5px;font-weight:700;color:var(--tx4);text-align:center}
.tlh .r,.tlr .r{text-align:right}
.tlr{min-height:48px;border-top:1px solid var(--line)}
.tlr.cur{background:rgba(var(--a1rgb),.07);border-radius:12px;border-top-color:transparent}
.tlw{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;line-height:1.1}
.tlw small{font-size:9.5px;color:var(--tx4);font-weight:600}
.tc{display:flex;align-items:center;justify-content:center;height:46px}
.bub2{width:var(--s);height:var(--s);border-radius:50%;border:0;padding:0;background:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 22%,transparent);font-size:9px;color:#fff;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.bub2.pl,.bub2.hoy{background:transparent;box-shadow:inset 0 0 0 1.5px var(--g)}
.bub2.fa{background:rgba(229,96,74,.18);box-shadow:none;color:var(--red);font-weight:800}
.bub2.au{background:transparent;box-shadow:none;color:var(--cya)}
.bub2.cur{opacity:.7}
.tlt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.tlt b{font-size:14px}
.tlt small{font-size:9.5px;color:var(--tx4)}
.tpk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tpk div{padding:9px 10px;border-radius:13px;background:var(--surf2);border:1px solid var(--line)}
.tpk b{display:block;font-size:19px;letter-spacing:-.02em}
.tpk small{font-size:12px;color:var(--tx3);font-weight:500}
.tpb{height:8px;border-radius:4px;background:var(--surf3);margin-top:12px;overflow:hidden}
.tpb i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--a1));border-radius:4px;transform-origin:left;animation:crecex .9s cubic-bezier(.2,.8,.2,1) both}
.tpd{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:stretch;margin-bottom:8px}
.tpd .libre{align-self:center;font-size:12.5px;color:var(--tx4)}
.tpc{position:relative;display:flex;flex-direction:column;gap:6px;padding:11px 12px 11px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surf);text-align:left;overflow:hidden;animation:entraDer .45s cubic-bezier(.2,.8,.2,1) both}
.tpc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line2)}
.tpc.v::before{background:var(--grn)}.tpc.a::before{background:var(--yel)}.tpc.n::before{background:#ef8d45}.tpc.r::before{background:#e5604a}
.tpc.pl,.tpc.hoy,.tpc.cur{border-style:dashed;background:transparent}
.tpc.pl::before,.tpc.hoy::before,.tpc.cur::before{background:var(--g);opacity:.6}
.tpc.au::before{background:var(--cya)}
.tpt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tpt b{font-size:14px}
.tpe{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(var(--fg),.07);color:var(--tx2);white-space:nowrap}
.tpc.v .tpe{background:rgba(var(--grnrgb),.15);color:var(--grn)}.tpc.a .tpe{background:rgba(var(--yelrgb),.16);color:var(--yel)}.tpc.r .tpe{background:rgba(229,96,74,.15);color:var(--red)}
.tpe.pl{background:rgba(var(--a1rgb),.14);color:var(--a1)}
.tpm{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px;color:var(--tx3)}
.tpm b{display:block;font-size:12.5px;color:var(--tx);font-weight:600}
.tpbar{height:5px;border-radius:3px;background:var(--surf3);overflow:hidden}
.tpbar i{display:block;height:100%;background:var(--g);transform-origin:left;animation:crecex .8s cubic-bezier(.2,.8,.2,1) .2s both}
.afd{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.afr svg{width:120px;height:120px}
.afl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--tx3)}
.afl>b{font-size:17px;color:var(--tx)}
.afl span{display:flex;align-items:center;gap:6px}
.afl span b{margin-left:auto;color:var(--tx);font-size:13px}
.afl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.afm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px}
.afm .dw{font-size:11px;font-weight:700;color:var(--tx4);text-align:center}
.afc{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;padding:3px 0;border-radius:12px;animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}

.eth{display:grid;grid-template-columns:1fr 112px 64px;gap:8px;padding:8px 0 6px;font-size:11px;font-weight:700;color:var(--tx4);text-transform:uppercase;letter-spacing:.5px}

.etr .tr svg{display:block}
.stk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;margin:0 -16px 6px;padding:8px 16px 10px;background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.stk .per{margin:0}
.per button{transition:background .2s,color .2s,border-color .2s}
.kps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kps .tile b{display:block;font-size:23px;letter-spacing:-.03em;margin-top:2px}
.kps .tile b small{font-size:12px;font-weight:500;color:var(--tx3);margin-left:3px;letter-spacing:0}
.kps .tile em{font-style:normal;font-size:11.5px;font-weight:700}
.kcap{margin:0 2px 10px;font-size:12.5px;color:var(--tx3)}
.cw{position:relative;margin-top:10px}
.cw svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair;overflow:visible}
.b{transform-box:fill-box;transform-origin:50% 100%;animation:crece .75s cubic-bezier(.2,.8,.2,1) both;transition:filter .15s,opacity .15s}

.b.hi{filter:brightness(1.25) drop-shadow(0 0 6px rgba(var(--a1rgb),.75))}
.cw.act .b:not(.hi){opacity:.55}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:traza 1.1s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.ar{opacity:0;animation:fade .9s ease .5s forwards}
@keyframes fade{to{opacity:1}}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.guia{stroke:var(--tx3);stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.guia.on{opacity:.8}
.foco{opacity:0;transition:opacity .15s}
.foco.on{opacity:1}
.bub{position:absolute;z-index:3;transform:translate(-50%,calc(-100% - 12px));padding:7px 10px;border-radius:11px;background:var(--tx);color:var(--bg);font-size:12px;line-height:1.35;white-space:nowrap;pointer-events:none;box-shadow:var(--sh);transition:left .12s ease,top .12s ease,opacity .15s}
.bub b{font-size:13.5px}
.bub[hidden]{display:block;opacity:0}
.sube{animation:sube .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sube{from{opacity:0;transform:translateY(10px)}}
.gx{border-top:1px solid var(--line)}
.gx:first-child{border-top:0}
.gr{display:grid;grid-template-columns:88px 1fr 36px 16px;gap:8px;align-items:center;width:100%;padding:9px 0;border:0;background:transparent;text-align:left;font-size:13.5px}
.gr i{position:relative;display:flex;height:11px;border-radius:6px;background:var(--line2);overflow:hidden}
.gr i::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--bg);opacity:.9}
.gr i u{display:block;height:100%;transform-origin:left;animation:crecex .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes crecex{from{transform:scaleX(0)}}
.gr b{text-align:right}
.gr svg{width:16px;height:16px;color:var(--tx4);transition:transform .2s}
.gr[aria-expanded="true"] svg{transform:rotate(90deg)}
.gd{padding:0 0 12px}
.gd .r{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--tx2)}
.gd .r span.s{color:var(--tx3);font-size:12px}
.wks{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 6px;padding:0 16px;scrollbar-width:none}
.wks::-webkit-scrollbar{display:none}
.wks button{flex:0 0 auto;height:32px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:600;color:var(--tx3);transition:background .2s,color .2s}
.wks button[aria-pressed="true"]{background:var(--a1);border-color:var(--a1);color:var(--ink)}
.ejc+.ejc{margin-top:12px}
.ejc .hd2{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.ejc .lam{border-radius:10px}
.ejc b.n{display:block;font-size:14.5px;line-height:1.25}
.ejc .s{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px}
.ejc .v{text-align:right}
.ejc .v b{display:block;font-size:20px;letter-spacing:-.03em}
.ejc .v em{font-style:normal;font-size:11.5px;font-weight:700}

.splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(var(--a1rgb),.16),transparent 55%),var(--bg);cursor:pointer;transition:opacity .45s ease,visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash .in{display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-tile{width:96px;height:96px;border-radius:29px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--surf3),var(--surf));border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(var(--fg),.06),0 0 64px rgba(var(--a1rgb),.4);animation:spPop .6s cubic-bezier(.2,.9,.25,1.2) both}
.sp-tile svg{width:56px;height:56px}
.sp-draw{stroke-dasharray:240;stroke-dashoffset:240;animation:spTrazo 1s .25s cubic-bezier(.6,.1,.2,1) forwards}
.sp-wm b{display:block;font-family:var(--f);font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,var(--a1),var(--cya));-webkit-background-clip:text;background-clip:text;color:transparent;animation:spSube .7s .35s cubic-bezier(.2,.8,.2,1) both}
.sp-wm span{display:block;margin-top:6px;font-family:var(--f);font-weight:700;font-size:12px;letter-spacing:6px;padding-left:6px;text-align:center;color:var(--tx3);animation:spSube .7s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes spPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes spTrazo{to{stroke-dashoffset:0}}
@keyframes spSube{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash{display:none}}

function serDia(d,f){if(f.e!=='ok')return 0;var k=Math.min(51,semIdx(d)),fac=PROG.H.ser[k]/76;return Math.max(6,Math.round(GSER[f.g]*Math.min(1.1,fac)+(rnd(+d/864e5)-.5)*3));}
